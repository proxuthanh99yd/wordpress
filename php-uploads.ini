[PHP]

;;;;;;;;;;;;;;;;;;;
; File Uploads - Optimized for WordPress
;;;;;;;;;;;;;;;;;;;

; Whether to allow HTTP file uploads.
file_uploads = On

; Maximum allowed size for uploaded files.
upload_max_filesize = 512M

; Maximum number of files that can be uploaded via a single request
max_file_uploads = 20

;;;;;;;;;;;;;;;;;;;
; Resource Limits
;;;;;;;;;;;;;;;;;;;

; Maximum amount of memory a script may consume (512MB for large WordPress sites)
memory_limit = 512M

; Maximum size of POST data that PHP will accept.
post_max_size = 256M

; Maximum execution time of each script, in seconds (10 minutes for large uploads/processing)
max_execution_time = 600

; Maximum time in seconds a script is allowed to parse input data, like POST and GET
max_input_time = 300

; Maximum number of GET/POST/COOKIE input variables that will be accepted
max_input_vars = 3000

;;;;;;;;;;;;;;;;;;;
; Error handling and logging
;;;;;;;;;;;;;;;;;;;

; Print out errors (as a part of the output). For production web sites,
; you're strongly encouraged to turn this feature off, and use error logging
; instead (see below).
display_errors = Off

; Even when display_errors is on, errors that occur during PHP's startup
; sequence are not displayed.
display_startup_errors = Off

; Log errors into a log file (server-specific log, stderr, or error_log (below))
log_errors = On

; Set maximum length of log_errors. In error_log information about the source is
; added. The default is 1024 and 0 allows to not apply any maximum length at all.
log_errors_max_len = 1024

; Do not log repeated messages. Repeated errors must occur in same file on same
; line unless ignore_repeated_source is set true.
ignore_repeated_errors = Off

; The default value is E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED.
; This will stop E_NOTICE, E_STRICT and E_DEPRECATED messages from appearing.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

;;;;;;;;;;;;;;;;;;;
; WordPress specific optimizations
;;;;;;;;;;;;;;;;;;;

; Realpath cache size (increase for better performance)
realpath_cache_size = 4096k

; Realpath cache TTL
realpath_cache_ttl = 600

; OPCache settings (if enabled)
opcache.memory_consumption = 256
opcache.max_accelerated_files = 7963
opcache.revalidate_freq = 0
opcache.enable_cli = 1
opcache.enable = 1